<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.github.repository_name }}</title>
    <meta name="description" content="为 Anki 笔记快速生成多语言语音。">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NCCX43ML1Q"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-NCCX43ML1Q');
    </script>

    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.65;
      }
      body {
        box-sizing: border-box;
        max-width: 860px;
        margin: 0 auto;
        padding: 2rem 1.25rem 4rem;
      }
      h1, h2, h3 { line-height: 1.3; }
      h1 { margin-top: 0; }
      a { color: #0969da; }
      pre {
        overflow-x: auto;
        padding: 1rem;
        border-radius: 8px;
        background: rgba(127, 127, 127, 0.12);
      }
      code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
      table { border-collapse: collapse; }
      th, td { padding: 0.45rem 0.75rem; border: 1px solid rgba(127, 127, 127, 0.3); }
      @media (prefers-color-scheme: dark) {
        a { color: #58a6ff; }
      }
    </style>
  </head>
  <body>
    <main>
      {{ content }}
    </main>
  </body>
</html>
